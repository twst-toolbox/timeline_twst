name: Build All-in-One Tool (ZIP Version)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Get Date
        id: date
        run: echo "TODAY=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. 改为 standalone 模式 (生成一个文件夹，大幅降低病毒误报率)
      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: main_tool.py
          mode: standalone 
          enable-plugins: tk-inter
          disable-console: true

      # 2. 将生成的文件夹重命名
      - name: Rename Folder
        run: |
          Rename-Item "build/main_tool.dist" "TWST_Auto_Tool_v${{ env.TODAY }}"

      # 3. 将文件夹打包成 ZIP 压缩包
      - name: Create ZIP Archive
        run: |
          Compress-Archive -Path "TWST_Auto_Tool_v${{ env.TODAY }}" -DestinationPath "TWST_Auto_Tool_v${{ env.TODAY }}.zip"

      # 4. 发布 ZIP 文件到 Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          files: "*.zip"
          tag_name: v${{ env.TODAY }}-${{ github.run_number }}
          name: "TWST Tool [${{ env.TODAY }}]"
          body: |
            自动构建版本: ${{ env.TODAY }}
            【防病毒误报版】请下载 ZIP 包，解压后运行里面的 main_tool.exe。
