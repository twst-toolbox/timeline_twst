name: Build TWST Tool (Robust Version)

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. 下载您的代码
        uses: actions/checkout@v3

      - name: 2. 使用专业机器人打包
        uses: cdrx/pyinstaller-action@v0
        with:
          # 你的Python脚本文件名
          script: twst_ocr.py
          
          # 生成的EXE文件名 (可以自定义)
          exe-name: twst_timeline_tool
          
          # 购物清单文件的名字
          requirements: requirements.txt
          
          # 打包参数：生成单个文件，并且运行时不显示黑色的命令行窗口
          onefile: true
          noconsole: true
