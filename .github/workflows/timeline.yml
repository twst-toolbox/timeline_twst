name: Build TWST Tool

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 给机器人发通行证，允许发布 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 1. 安装依赖库
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 2. 使用 Nuitka 打包 (稳定、快)
      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: twst_ocr.py          # 您的脚本名字
          mode: onefile                     # 生成单文件
          enable-plugins: tk-inter          # 开启图形界面支持
          disable-console: true             # 运行时不显示黑框

      # 3. 备份上传 (Artifacts) - 双重保险
      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: TWST-Tool-Backup
          path: build/*.exe

      # 4. 发布到 Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') == false
        with:
          files: build/*.exe
          tag_name: v${{ github.run_number }}
          name: "TWST Tool v${{ github.run_number }}"
          body: "TWST 字幕提取器 (V8 增强版)"
