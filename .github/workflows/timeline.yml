name: Build TWST Tool

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. 下载代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装零件 (强制安装所有需要的库)
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless srt Pillow

      - name: 4. 使用 Nuitka 打包 (V8.1 特化)
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: twst_ocr.py
          mode: onefile
          # 开启 Tkinter 插件支持
          enable-plugins: tk-inter
          disable-console: true
          # 忽略一些不必要的警告防止中断
          nuitka-args: --standalone --windows-icon-from-ico=NONE

      - name: 5. 检查是否生成了文件 (防止下一步报错)
        run: |
          ls -R
          if (Test-Path "build/*.exe") { echo "EXE 已经找到！" } else { echo "找不到生成的文件！"; exit 1 }

      - name: 6. 发布到 Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          files: build/*.exe
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: "TWST Tool Build ${{ github.run_number }}"
          body: "TWST 字幕提取器 V8.1 修复版 (由 GitHub Actions 自动构建)"
