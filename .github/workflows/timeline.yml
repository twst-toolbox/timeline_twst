name: Build TWST Tool

# 触发条件：只要上传代码，就开始干活
on: [push]

jobs:
  build:
    # 使用 Windows 系统
    runs-on: windows-latest

    steps:
    # 1. 下载您的代码到云端
    - uses: actions/checkout@v3

    # 2. 安装 Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 安装依赖库 (OpenCV, Tkinter支持, 打包工具等)
    - name: Install dependencies
      run: |
        pip install opencv-python-headless srt pillow pyinstaller

    # 4. 开始打包 (生成单文件EXE，不弹黑框)
    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile twst_ocr.py

    # 5. 把生成的 EXE 上传给您下载
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWST_Sub_Tool
        path: dist/twst_ocr.exe
