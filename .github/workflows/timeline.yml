name: Build TWST Tool

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. 下载代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless srt Pillow

      - name: 4. 使用 Nuitka 打包 (已适配最新参数)
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: twst_ocr.py
          # 模式设为单文件EXE
          mode: onefile
          # 开启图形界面支持
          enable-plugins: tk-inter
          # 运行时不显示黑色的命令行窗口
          disable-console: true
          # 以前写在 nuitka-args 里的 --standalone 其实在 onefile 模式下是自动包含的
          # 这里我们删除了不被识别的 nuitka-args 指令

      - name: 5. 检查生成的文件
        run: |
          # 这里的操作是为了确保文件真的在 build 文件夹里
          ls -R build/

      - name: 6. 发布到 Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          # 这里的通配符会自动寻找 build 文件夹下任何结尾是 .exe 的文件
          files: build/*.exe
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: "TWST Tool Build ${{ github.run_number }}"
          body: "TWST 字幕提取器 V8.1 (修复了机器人参数报错问题)"
