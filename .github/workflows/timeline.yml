name: Build TWST Tool

on:
  # 只要主分支有变动就跑
  push:
    branches: [ "main", "master" ]
  # 【关键】增加手动触发按钮，哪怕没自动跑也能点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install opencv-python-headless srt Pillow

      # 使用 Nuitka 打包
      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: twst_ocr.py
          mode: onefile
          enable-plugins: tk-inter
          disable-console: true

      # 发布到 Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          files: build/*.exe
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: "TWST Tool Build ${{ github.run_number }}"
          body: "TWST 字幕提取器 V8.1 修复版"
