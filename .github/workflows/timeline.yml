name: Build and Release TWST Tool

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. 下载您的代码
        uses: actions/checkout@v3

      - name: 2. 使用专业机器人打包 (已修复版本号)
        uses: cdrx/pyinstaller-action@main
        with:
          script: twst_ocr.py
          exe-name: twst_timeline_tool
          requirements: requirements.txt
          onefile: true
          noconsole: true
          
      - name: 3. 自动发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/twst_timeline_tool.exe
          tag_name: v${{ github.run_number }}
          name: "TWST Timeline Tool v${{ github.run_number }}"
          body: |
            自动打包的最新版字幕提取工具。
            下载 .exe 文件直接运行即可。
