name: Build All-in-One Tool

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Get Date
        id: date
        run: echo "TODAY=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. 打包生成 EXE
      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: main_tool.py
          output-file: TWST_Auto_Tool.exe
          mode: onefile
          enable-plugins: tk-inter
          disable-console: true
          # 尝试添加一点元数据，增加可信度（玄学，但有用）
          company-name: "TWST Fan Tools"
          product-name: "TWST Auto Sub"
          file-version: "9.0.0.0"

      # 2. 【关键新增】把它压缩成 ZIP
      # 这样浏览器下载时就不会直接报警删除了
      - name: Zip the output
        run: |
          powershell Compress-Archive -Path TWST_Auto_Tool.exe -DestinationPath TWST_Auto_Tool_v${{ env.TODAY }}.zip

      # 3. 发布 (上传 ZIP 而不是 EXE)
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          # 只上传 zip 文件
          files: TWST_Auto_Tool_v${{ env.TODAY }}.zip
          
          tag_name: v${{ env.TODAY }}-${{ github.run_number }}
          name: "TWST Tool [${{ env.TODAY }}]"
          body: |
            自动构建版本: ${{ env.TODAY }}
            
            ⚠️ **下载提示：**
            下载解压后，如果运行提示“Windows 已保护您的电脑”：
            请点击 **“更多信息”** -> **“仍要运行”**。
            这是因为软件没有付费购买数字证书，属于正常现象。
